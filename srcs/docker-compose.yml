services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:latest
    volumes:
      - mariadb:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    networks:
      - inception
    restart: on-failure
  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - mariadb
    env_file:
      - .env
    secrets:
      - db_password
    networks:
      - inception
    restart: on-failure
  nginx:
    build: ./requirements/nginx
    image: nginx
    volumes:
      - wordpress:/var/www/html
    ports:
      - "443:443"
    depends_on:
      - wordpress
    networks:
      - inception
    restart: on-failure
  
networks:
  inception:
    driver: bridge

volumes:
  mariadb:
  wordpress:

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt